name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: ${{ matrix.isa }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: riscv32
            cross_compile: riscv64-unknown-elf
            cross_packages: >-
              binutils-riscv64-unknown-elf
              gcc-riscv64-unknown-elf
          - isa: riscv64
            cross_compile: riscv64-unknown-elf
            cross_packages: >-
              binutils-riscv64-unknown-elf
              gcc-riscv64-unknown-elf

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize required submodules
        run: |
          git submodule update --init --depth 1 utils/mini-gdbstub
          git submodule update --init utils/readline

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang-20 \
            clang-tools-20 \
            cmake \
            libncurses-dev \
            llvm-dev \
            ninja-build \
            ${{ matrix.cross_packages }}

      - name: Build KXemu
        run: |
          make -f build.mk \
            CONFIG_ISA=${{ matrix.isa }} \
            CONFIG_CC=clang++-20 \
            CONFIG_HALT_WHEN_BREAK=y \
            CMAKE_ARGS="-DLLVM_DIR=$(llvm-config --cmakedir)"

      - name: Run CPU tests
        run: |
          make -C tests/cpu-tests run \
            ISA=${{ matrix.isa }} \
            CROSS_COMPILE=${{ matrix.cross_compile }}
